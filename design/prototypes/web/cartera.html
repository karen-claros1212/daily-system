<!DOCTYPE html>

  <nav class="sidebar">

      <div class="logo-symbol">D</div>

    <ul class="nav-links">
      <li><a href="index.html">Dashboard</a></li>

      </div>
      <div class="client-card">
        <div class="client-info">
          <h3>Ana Martínez</h3>
          <span class="client-route">Ruta Centro</span>
        </div>
        <div class="client-status" style="background:#C8E6C9;color:#0F6B55;">Al día</div>
