<!-- Daily System — Brand Concept C: Daily Check -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0B4654"/>
  
  <!-- Route path -->
  <path d="M20 50 L40 50 L45 35 L55 65 L60 50 L80 50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Check mark at end -->
  <path d="M72 42 L78 48 L88 36" stroke="#D7A33D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Start node -->
  <circle cx="20" cy="50" r="5" fill="#D7A33D"/>
  <!-- Waypoint nodes -->
  <circle cx="45" cy="35" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="55" cy="65" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="60" cy="50" r="3" fill="#FFFFFF" opacity="0.6"/>
</svg>
