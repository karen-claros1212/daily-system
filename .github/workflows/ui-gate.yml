name: UI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ui-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb534c0cce42f22e73f01b # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@b611c0dad3767a764ae17aa60ea91d15296fc38f # v2.14.0
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Token generator check
        run: |
          cd ../..
          dart run tool/generate_design_tokens.dart --check

      - name: Flutter analyze (strict)
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Validate opaque colors
        run: |
          dart run tool/generate_design_tokens.dart
          grep -r "Color(0x0" lib/theme/generated/ | grep -v "0xFF" && exit 1 || echo "All colors opaque: PASS"
