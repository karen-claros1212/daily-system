name: UI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ui-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb534c0cce42f22e73f01b # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@b611c0dad3767a764ae17aa60ea91d15296fc38f # v2.14.0
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Token generator check (root)
        run: dart run tool/generate_design_tokens.dart --check

      - name: Generator unit tests
        run: dart test apps/mobile/test/generator_test.dart
        working-directory: .

      - name: Flutter analyze (strict)
        run: flutter analyze
        working-directory: apps/mobile

      - name: Flutter test (widget + golden + semantics + generator)
        run: flutter test
        working-directory: apps/mobile

      - name: Validate opaque colors (no grep)
        run: dart test apps/mobile/test/generator_test.dart
        working-directory: .
