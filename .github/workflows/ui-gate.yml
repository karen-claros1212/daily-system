name: UI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ui-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@7814e4f6c70abd7a5641333f613efa098fe34381 # v2.14.0
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Token generator check (root)
        run: dart run tool/generate_design_tokens.dart --check

      - name: Flutter analyze (strict)
        run: flutter analyze
        working-directory: apps/mobile

      - name: Flutter test (widget + golden + semantics + generator)
        run: flutter test
        working-directory: apps/mobile
