name: Backend CI

on:
  push:
    branches: [master, hardening/**]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: API tests + Alembic check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v6.5.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Alembic check (no drift)
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic current

      - name: Run pytest
        working-directory: apps/api
        run: |
          pytest src/tests/ -q --tb=short
