name: Backend CI

on:
  push:
    branches: [master, hardening/**, product/**]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: API tests + Alembic check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daily_backend_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Alembic check (no drift)
        working-directory: apps/api
        env:
          API_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daily_backend_ci_test
          DAILY_ENV: test
        run: |
          alembic upgrade head
          alembic current

      - name: Run pytest
        working-directory: apps/api
        run: |
          pytest src/tests/ -q --tb=short

      - name: PostgreSQL NIT concurrency gate
        working-directory: apps/api
        env:
          API_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daily_backend_ci_test
          DAILY_ENV: test
        run: |
          pytest \
            src/tests/test_onboarding.py::TestNitConcurrentePostgres::test_13_dos_transacciones_concurrentes_mismo_nit_201_y_409 \
            -q --tb=short
