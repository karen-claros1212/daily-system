[pytest]
# pytest-asyncio 0.24+: define explícitamente el loop scope para fixtures
# asincrónicas (requerido desde 0.24 para evitar la PytestDeprecationWarning).
# La suite no usa fixtures asíncronas: el scope es semánticamente inerte y
# coincide con el default futuro de pytest-asyncio (function).
asyncio_default_fixture_loop_scope = function
