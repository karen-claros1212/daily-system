name: daily_system
description: "Daily System — Flutter Offline Alpha for cobro diario en Colombia."
publish_to: 'none'

version: 1.0.0-alpha.1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
